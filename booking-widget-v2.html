
<!--
===========================================================
  LILY SERVICE BOOKING WIDGET
  Source for the theme file: snippets/booking-system.liquid
  Rendered inside the product form by blocks/buy-buttons.liquid:
    {% render 'booking-system' %}
===========================================================
  Flow (unchanged): pick date → pick morning/evening slot →
  Add to cart → cart page (delivery area) → checkout.
  Rules: 24h notice (Kuwait time), max 2 bookings per slot per day,
  one booking per product per slot, linked products block each other,
  admin-blocked dates/slots.
===========================================================
-->

<input type="hidden" id="bk-date-val"  name="properties[📅 Date]">
<input type="hidden" id="bk-slot-val"  name="properties[⏰ Slot]">
<!-- Hidden (underscore) machine-readable copies for the webhook/cart guard -->
<input type="hidden" id="bk-date-iso"  name="properties[_bk_date]">
<input type="hidden" id="bk-slot-key"  name="properties[_bk_slot]">

<!-- Widget Mount Point -->
<div id="bk-widget"></div>

<style>
#bk-widget {
  --gold:      #8F6BA5;
  --gold-lt:   #B99ACC;
  --gold-bg:   #F6F1FA;
  --gold-border:#E4D9EC;
  --dark:      #241C2D;
  --mid:       #51405F;
  --muted:     #7E738A;
  --surface:   #FFFFFF;
  --white:     #FFFFFF;
  --green:     #2F7A59;
  --red:       #B42318;
  --radius:    0px;
  font-family: 'DM Sans', sans-serif;
  max-width: 460px;
  margin: 18px 0 12px;
  color: var(--dark);
  background: linear-gradient(180deg, rgba(143,107,165,0.08), rgba(143,107,165,0));
  padding: 4px;
  border-radius: 0px;
}
#bk-widget * { box-sizing: border-box; margin: 0; padding: 5px; }

/* ── Step card ── */
.bk-card {
  border: 1px solid var(--gold-border);
  border-radius: 0px;
  background: var(--surface);
  margin-bottom: 10px;
  overflow: hidden;
  transition: box-shadow .2s, transform .2s, border-color .2s;
  box-shadow: 0 6px 18px rgba(42, 26, 54, 0.06);
}
.bk-card:focus-within { box-shadow: 0 0 0 3px rgba(143,107,165,.18), 0 6px 18px rgba(42, 26, 54, 0.08); }

.bk-card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px;
  background: linear-gradient(135deg, rgba(143,107,165,0.09), rgba(143,107,165,0.03));
  border-bottom: 1px solid var(--gold-border);
}
.bk-step-num {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--gold); color: #fff;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .2s;
}
.bk-step-num.done { background: var(--green); }
.bk-card-head h4 {
  font-family: 'DM Serif Display', serif;
  font-size: 14px; font-weight: 400;
  color: var(--mid);
}

/* ── Calendar ── */
.bk-cal-wrap { padding: 12px 10px 10px; }
.bk-cal-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.bk-cal-nav button {
  background: none; border: 1px solid var(--gold-border);
  border-radius: 0px; width: 30px; height: 30px;
  cursor: pointer; color: var(--gold); font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.bk-cal-nav button:hover:not(:disabled) { background: var(--gold-bg); border-color: var(--gold); }
.bk-cal-nav button:disabled { opacity: .28; cursor: default; }
.bk-cal-title {
  font-family: 'DM Serif Display', serif;
  font-size: 15px; color: var(--mid);
}
.bk-grid {
  display: grid; grid-template-columns: repeat(7,1fr); gap: 3px;
}
.bk-dow {
  text-align: center; font-size: 10px; font-weight: 600;
  color: var(--muted); letter-spacing: .7px; text-transform: uppercase;
  padding: 2px 0 5px;
}
.bk-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 0px; font-size: 12px; font-weight: 500;
  cursor: pointer; border: 1.5px solid transparent;
  transition: all .15s; color: var(--dark);
  position: relative; user-select: none;
}
.bk-day:hover:not(.bk-off):not(.bk-sel) { background: var(--gold-bg); border-color: var(--gold-lt); }
.bk-day.bk-sel  { background: linear-gradient(135deg, var(--gold), #6F4F86); color: #fff; border-color: var(--gold); font-weight: 700; box-shadow: 0 8px 18px rgba(143,107,165,0.25); }
.bk-day.bk-off  { background: #F5F0E8; color: #CBBFAE; cursor: not-allowed; opacity: 0.6; }
.bk-day.bk-today:not(.bk-sel) { border-color: var(--gold-lt); color: var(--gold); font-weight: 700; }
.bk-day.bk-empty { pointer-events: none; background: none; }

/* ── Slots ── */
.bk-slots { display: flex; gap: 12px; padding: 14px; }

/* Floating WhatsApp-chat-style availability bubble —
   sits above the store's fixed WhatsApp icon (bottom-left: 20px, 60x60) */
.bk-avail-float {
  position: fixed;
  left: 20px;
  bottom: 90px;
  z-index: 9998;
  box-sizing: border-box;
  max-width: calc(100vw - 40px);
  width: max-content;
  background: #ffffff;
  border: 1px solid #E4D9EC;
  border-radius: 12px;
  padding: 7px 12px 7px 26px;
  box-shadow: 0 6px 16px rgba(42, 26, 54, 0.16);
  direction: rtl;
  text-align: right;
  font-family: 'DM Sans', sans-serif;
  font-size: 11.5px;
  font-weight: 600;
  color: #51405F;
  line-height: 1.6;
  animation: bkAvailPop .25s ease;
}
.bk-avail-float::after {
  content: '';
  position: absolute;
  left: 22px;
  bottom: -6px;
  width: 10px;
  height: 10px;
  background: #ffffff;
  border-right: 1px solid #E4D9EC;
  border-bottom: 1px solid #E4D9EC;
  transform: rotate(45deg);
}
.bk-avail-float-close {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 16px;
  height: 16px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: #F1EBF6;
  color: #7E738A;
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bk-avail-float-close:hover { background: #E4D9EC; color: #51405F; }
@keyframes bkAvailPop {
  from { opacity: 0; transform: translateY(8px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
/* Extra-compact on small phones */
@media (max-width: 480px) {
  .bk-avail-float {
    font-size: 11px;
    line-height: 1.55;
    padding: 6px 10px 6px 24px;
    border-radius: 11px;
  }
  .bk-avail-float-close {
    top: 5px;
    left: 5px;
    width: 15px;
    height: 15px;
    font-size: 9px;
  }
  .bk-avail-float::after { left: 20px; }
}

/* Delivery-vs-service note shown under the slots */
.bk-delivery-note {
  margin: 0 14px 14px;

  border-radius: 0px;
  background: #F4ECF8;
  border: 1px solid #D6C3E3;
  color: var(--mid);

  font-weight: 600;
  line-height: 1.6;

.bk-slot {

.bk-slots-ph {

/* ── Summary ── */
#bk-summary {
  padding: 12px 14px;
  background: linear-gradient(135deg, #2A2032 0%, #4A3858 100%);

/* ── Error ── */
#bk-err {
  padding: 11px 14px; border-radius: 0px; margin-bottom: 12px;

#bk-err.show { display: block; }

/* Flash effect when a validation error appears (e.g. slot taken in another tab) */
@keyframes bk-flash {
  0%   { background: #FFE3DF; border-color: #E8938B; }
  30%  { background: #FFD9D3; border-color: #E26B60; }
  100% { background: #FFF0EE; border-color: #F5C6C2; }
}
#bk-err.bk-flash {
  animation: bk-flash .9s ease-out;
}

/* ── Checking spinner ── */
.bk-spin {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid var(--gold-border); border-top-color: var(--gold);
  border-radius: 50%; animation: bk-spin .8s linear infinite;
  vertical-align: middle; margin-right: 5px;
}
@keyframes bk-spin { to { transform: rotate(360deg); } }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  'use strict';

  // ─── Supabase client (public key: reads availability only) ───────
  var sb = supabase.createClient(BK_SUPABASE_URL, BK_SUPABASE_KEY);

  // Public, customer-data-free view of active bookings (see SQL migration).
  var SLOTS_TABLE = 'booking_slots';

  // ─── Constants ───────────────────────────────────────────────────
  var MAX_BOOKINGS_PER_SLOT = 2;
  var SLOTS = {
    morning: { label: 'Morning', time: '6:30 AM – 8:30 AM', icon: '🌅' },
    evening: { label: 'Evening', time: '2:30 PM – 6:30 PM', icon: '🌇' }
  };
  var DOW = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'
  ];
  var HOUR_MS = 60 * 60 * 1000;
  var KUWAIT_OFFSET_MS = 3 * HOUR_MS; // Kuwait is UTC+3 all year (no DST)

  // ─── State ───────────────────────────────────────────────────────
  var state = {
    viewMonth: null,   // Date object — first of displayed month
    selDate: null,     // selected Date (calendar day)
    selSlot: null,     // 'morning' | 'evening'
    avail: null,       // { morning: bool, evening: bool, counts, mine }
    showSlots: false,
    productIds: [],        // DB ids of this product
    linkedProductIds: [],  // DB ids of linked products
    shopifyProductId: null,
    fullBlockedDates: {},
    fullBookedDates: {},
    checking: false,
    submitting: false,
    bubbleDismissed: false, // floating availability bubble closed for the current date
    liveRefreshTimer: null,
    rtChannel: null
  };

  // ─── TIME HELPERS (Kuwait time, 24-hour rule) ─────────────────────
  // Calendar days are plain local Date objects (y/m/d); every "now"
  // comparison is done against the slot's real start time in Kuwait, so
  // customers browsing from another timezone see the same availability
  // as the database enforces.

  function kuwaitDay(ms) {
    var k = new Date(ms + KUWAIT_OFFSET_MS);
    return new Date(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate());
  }

  function nowPlus24Hours() {
    return new Date(Date.now() + 24 * HOUR_MS);
  }

  function getSlotStart(date, slotKey) {
    var hour = slotKey === 'morning' ? 6 : 14;
    // 06:30 / 14:30 Kuwait time as an absolute instant
    return new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), hour, 30) - KUWAIT_OFFSET_MS);
  }

  function isSlotBookable(date, slotKey) {
    return getSlotStart(date, slotKey) >= nowPlus24Hours();
  }

  // First calendar day that can still have a bookable slot (Kuwait date of now + 24h)
  function getMinBookableDate() {
    return kuwaitDay(Date.now() + 24 * HOUR_MS);
  }

  // Maximum bookable date (2 months from today, Kuwait date)
  function getMaxBookableDate() {
    var d = kuwaitDay(Date.now());
    d.setMonth(d.getMonth() + 2);
    return d;
  }

  // Date must be within range and have at least one bookable slot
  function isDateBookable(date) {
    var compareDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    return compareDate <= getMaxBookableDate() &&
      (isSlotBookable(date, 'morning') || isSlotBookable(date, 'evening'));
  }

  // Format date for API (YYYY-MM-DD)
  function fmt(d) {
    if (!d) return '';
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  // ─── Product scope ───────────────────────────────────────────────
  function linkedShopifyIdFor(shopifyId) {
    for (var i = 0; i < BK_LINKED_PAIRS.length; i++) {
      var pair = BK_LINKED_PAIRS[i];
      if (pair[0] === shopifyId) return pair[1];
      if (pair[1] === shopifyId) return pair[0];
    }
    return null;
  }

  function uniq(arr) {
    var out = [];
    (arr || []).forEach(function(v) {
      if (!v) return;
      if (out.indexOf(v) === -1) out.push(v);
    });
    return out;
  }

  function myIds() {
    return state.productIds.length ? state.productIds : [state.shopifyProductId || BK_PRODUCT_ID];
  }

  function inferShopifyProductId() {
    try {
      var root = document.getElementById('bk-widget');
      var pfc = root && root.closest && root.closest('product-form-component');
      if (pfc && pfc.dataset && pfc.dataset.productId) return String(pfc.dataset.productId);
      if (window.ShopifyAnalytics && window.ShopifyAnalytics.meta && window.ShopifyAnalytics.meta.product &&
          window.ShopifyAnalytics.meta.product.id) {
        return String(window.ShopifyAnalytics.meta.product.id);
      }
      if (window.meta && window.meta.product && window.meta.product.id) return String(window.meta.product.id);
    } catch (_) { /* fall through */ }
    return /^\d+$/.test(BK_PRODUCT_ID) ? BK_PRODUCT_ID : null;
  }

  function inferProductHandle() {
    try {
      var path = window.location.pathname || '';
      var m = path.match(/\/products\/([^/?#]+)/i);
      return m && m[1] ? decodeURIComponent(m[1]) : null;
    } catch (_) {
      return null;
    }
  }

  async function resolveProductScope() {
    state.shopifyProductId = inferShopifyProductId();
    var shopifyId = state.shopifyProductId;
    var handle = inferProductHandle();

    var r = await sb.from('products')
      .select('id, linked_product_id, shopify_product_id, shopify_handle');
    var rows = r.data || [];

    var base = rows.find(function(p) {
      return shopifyId && p.shopify_product_id && String(p.shopify_product_id) === shopifyId;
    }) || rows.find(function(p) {
      return handle && p.shopify_handle && String(p.shopify_handle).toLowerCase() === handle.toLowerCase();
    });
    if (!base) return;

    var linked = [];
    if (base.linked_product_id) linked.push(base.linked_product_id);
    // Fallback: linked pair configured above (Shopify ids → DB ids)
    var pairShopifyId = linkedShopifyIdFor(String(base.shopify_product_id || shopifyId || ''));
    if (pairShopifyId) {
      var pairRow = rows.find(function(p) { return String(p.shopify_product_id) === pairShopifyId; });
      if (pairRow) linked.push(pairRow.id);
    }

    state.productIds = [base.id];
    state.linkedProductIds = uniq(linked);
  }

  // ─── Availability ────────────────────────────────────────────────
  async function loadFullBlockedDates() {
    var min = fmt(getMinBookableDate());
    var max = fmt(getMaxBookableDate());
    var r = await sb.from('blocked_slots')
      .select('block_date, slot, product_id')
      .gte('block_date', min)
      .lte('block_date', max);

    var grouped = {};
    var productIds = myIds();
    (r.data || []).forEach(function(b) {
      if (b.product_id && productIds.indexOf(b.product_id) === -1) return;
      var day = b.block_date;
      if (!grouped[day]) grouped[day] = { all: false, morning: false, evening: false };
      if (!b.slot || b.slot === 'all') grouped[day].all = true;
      if (b.slot === 'morning') grouped[day].morning = true;
      if (b.slot === 'evening') grouped[day].evening = true;
    });

    var full = {};
    Object.keys(grouped).forEach(function(d) {
      var g = grouped[d];
      if (g.all || (g.morning && g.evening)) full[d] = true;
    });
    state.fullBlockedDates = full;
  }

  async function loadFullBookedDates() {
    var min = fmt(getMinBookableDate());
    var max = fmt(getMaxBookableDate());
    var r = await sb.from(SLOTS_TABLE)
      .select('booking_date, slot, product_id')
      .eq('is_active', true)
      .gte('booking_date', min)
      .lte('booking_date', max);

    var grouped = {};
    (r.data || []).forEach(function(b) {
      if (!b || !b.booking_date || !b.slot) return;
      var day = b.booking_date;
      if (!grouped[day]) grouped[day] = { morning: 0, evening: 0 };
      if (b.slot === 'morning') grouped[day].morning += 1;
      if (b.slot === 'evening') grouped[day].evening += 1;
    });

    var full = {};
    Object.keys(grouped).forEach(function(d) {
      var g = grouped[d];
      if (g.morning >= MAX_BOOKINGS_PER_SLOT && g.evening >= MAX_BOOKINGS_PER_SLOT) full[d] = true;
    });
    state.fullBookedDates = full;
  }

  async function loadSlotCounts(dateStr) {
    var counts = { morning: 0, evening: 0 };
    var mine = { morning: false, evening: false };
    var linked = { morning: false, evening: false };
    var r = await sb.from(SLOTS_TABLE)
      .select('slot, product_id')
      .eq('is_active', true)
      .eq('booking_date', dateStr);
    if (r.error) throw r.error;

    var productIds = myIds();
    var linkedIds = state.linkedProductIds;
    (r.data || []).forEach(function(b) {
      if (!b || !b.slot) return;
      if (b.slot === 'morning') counts.morning += 1;
      if (b.slot === 'evening') counts.evening += 1;
      // Unique products rule: this product already holds the slot.
      if (productIds.indexOf(b.product_id) !== -1) mine[b.slot] = true;
      // Linked product (Dafwa ↔ Naseem) holds the slot.
      if (linkedIds.indexOf(b.product_id) !== -1) linked[b.slot] = true;
    });

    return { counts: counts, mine: mine, linked: linked };
  }

  async function checkAvail(dateStr) {
    var slotData = await loadSlotCounts(dateStr);
    var taken = {
      morning: slotData.linked.morning,
      evening: slotData.linked.evening
    };

    // Manual blocked slots (global + product-specific)
    var productIds = myIds();
    var r3 = await sb.from('blocked_slots')
      .select('slot, product_id')
      .eq('block_date', dateStr);
    (r3.data || []).forEach(function(b) {
      if (!b.product_id || productIds.indexOf(b.product_id) !== -1) {
        if (!b.slot || b.slot === 'all') {
          taken.morning = true;
          taken.evening = true;
        } else {
          taken[b.slot] = true;
        }
      }
    });

    return {
      morning: !taken.morning && !slotData.mine.morning && slotData.counts.morning < MAX_BOOKINGS_PER_SLOT,
      evening: !taken.evening && !slotData.mine.evening && slotData.counts.evening < MAX_BOOKINGS_PER_SLOT,
      counts: slotData.counts,
      mine: slotData.mine
    };
  }

  // Applies the 24h rule on top of DB availability for a picked date.
  function withTimeRule(avail, date) {
    if (avail) {
      avail.morning = avail.morning && isSlotBookable(date, 'morning');
      avail.evening = avail.evening && isSlotBookable(date, 'evening');
    }
    return avail;
  }

  // ─── Cart line-item booking properties ─────────────────────────────
  var MONTH_INDEX = {};
  MONTHS.forEach(function(m, i) { MONTH_INDEX[m.toLowerCase()] = i + 1; });

  function propValue(props, name) {
    if (!props) return null;
    if (Array.isArray(props)) {
      for (var i = 0; i < props.length; i++) {
        if (props[i] && props[i].name === name) return props[i].value;
      }
      return null;
    }
    return typeof props === 'object' && props[name] != null ? props[name] : null;
  }

  function parseDisplayDate(v) {
    if (!v) return null;
    var iso = String(v).match(/(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return iso[1] + '-' + iso[2] + '-' + iso[3];
    var dmy = String(v).match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
    if (dmy && MONTH_INDEX[dmy[2].toLowerCase()]) {
      return dmy[3] + '-' + String(MONTH_INDEX[dmy[2].toLowerCase()]).padStart(2, '0') + '-' + dmy[1].padStart(2, '0');
    }
    return null;
  }

  function parseSlotText(v) {
    var s = String(v || '').toLowerCase();
    if (!s) return null;
    if (s.indexOf('evening') !== -1 || s.indexOf('2:30') !== -1 || s.indexOf('14:30') !== -1 || s.indexOf('pm') !== -1) return 'evening';
    return 'morning';
  }

  function readBookingProps(props) {
    var key = propValue(props, '_bk_slot');
    return {
      date: parseDisplayDate(propValue(props, '_bk_date')) || parseDisplayDate(propValue(props, '📅 Date')),
      slot: (key === 'morning' || key === 'evening') ? key : parseSlotText(propValue(props, '⏰ Slot'))
    };
  }

  // Unique products rule, pre-checkout: is the SAME product already in the
  // cart for the SAME date + slot (e.g. added from another tab)?
  async function checkCartForConflict(dateStr, slotKey) {
    try {
      var resp = await fetch('/cart.js', { cache: 'no-store' });
      if (!resp.ok) return null;
      var cart = await resp.json();
      var items = (cart && cart.items) || [];
      var targetId = state.shopifyProductId || BK_PRODUCT_ID;

      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (String(it.product_id) !== String(targetId)) continue;
        var b = readBookingProps(it.properties);
        if (b.date === dateStr && b.slot === slotKey) return true;
      }
      return false;
    } catch (_) {
      return null; // couldn't read cart — don't hard-block, DB trigger still enforces
    }
  }

  // ─── Live refresh ────────────────────────────────────────────────
  async function refreshLiveAvailability() {
    await Promise.all([loadFullBlockedDates(), loadFullBookedDates()]);
    await refreshSelectedDateOnly();
  }

  // Lightweight poll: only re-checks the selected date.
  async function refreshSelectedDateOnly() {
    if (state.selDate && !state.submitting) {
      state.avail = withTimeRule(await checkAvail(fmt(state.selDate)), state.selDate);
      if (state.selSlot && state.avail[state.selSlot] === false) {
        state.selSlot = null;
      }
    }
    if (!state.submitting) render();
  }

  function startLiveRefresh() {
    if (state.liveRefreshTimer) {
      clearInterval(state.liveRefreshTimer);
    }
    // Refresh instantly when the user returns to this tab.
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        refreshLiveAvailability().catch(function() {});
      }
    });
    // Fast poll fallback (2s) in case realtime is unavailable or suspended.
    state.liveRefreshTimer = setInterval(function() {
      if (document.visibilityState === 'visible') {
        refreshSelectedDateOnly().catch(function() {});
      }
    }, 2000);
    // Instant refresh: the DB bumps availability_ping whenever bookings or
    // blocked_slots change (no customer data is broadcast).
    try {
      state.rtChannel = sb
        .channel('bk-widget-live-' + Math.random().toString(36).slice(2, 8))
        .on('postgres_changes', { event: '*', schema: 'public', table: 'availability_ping' }, function() {
          refreshLiveAvailability().catch(function() {});
        })
        .subscribe();
    } catch (e) {
      // Realtime not available — the 2s poll still acts as a fallback.
    }
  }

  // ─── Render ──────────────────────────────────────────────────────
  function render() {
    var root = document.getElementById('bk-widget');
    if (!root) return;
    root.innerHTML =
      renderCalCard() +
      (state.showSlots ? renderSlotCard() : '') +
      renderSummary() +
      '<div id="bk-err"></div>';

    bindCal();
    bindSlots();
    syncHiddenInputs();
    syncSummary();
    syncAddToCartState();
    syncAvailBubble();
  }

  // ── Calendar card ─────────────────────────────────────────────────
  function renderCalCard() {
    var vm = state.viewMonth;
    var minDate = getMinBookableDate();
    var maxDate = getMaxBookableDate();

    var firstDay = new Date(vm.getFullYear(), vm.getMonth(), 1);
    var lastDay = new Date(vm.getFullYear(), vm.getMonth() + 1, 0);

    var prevFirst = new Date(vm.getFullYear(), vm.getMonth() - 1, 1);
    var nextFirst = new Date(vm.getFullYear(), vm.getMonth() + 1, 1);
    var canPrev = prevFirst >= new Date(minDate.getFullYear(), minDate.getMonth(), 1);
    var canNext = nextFirst <= new Date(maxDate.getFullYear(), maxDate.getMonth(), 1);

    var done = !!state.selDate;
    var head = '<div class="bk-card-head">' +
      '<div class="bk-step-num' + (done ? ' done' : '') + '">' + (done ? '✓' : '1') + '</div>' +
      '<h4>Select Delivery Date</h4></div>';

    var grid = '<div class="bk-grid">';
    DOW.forEach(function(d) {
      grid += '<div class="bk-dow">' + d + '</div>';
    });

    for (var b = 0; b < firstDay.getDay(); b++) {
      grid += '<div class="bk-day bk-empty"></div>';
    }

    for (var d = 1; d <= lastDay.getDate(); d++) {
      var date = new Date(vm.getFullYear(), vm.getMonth(), d);
      var dStr = fmt(date);

      var off = !isDateBookable(date) || !!state.fullBlockedDates[dStr] || !!state.fullBookedDates[dStr];
      var isSel = state.selDate && fmt(state.selDate) === dStr;
      var cls = 'bk-day' +
        (off ? ' bk-off' : '') +
        (isSel ? ' bk-sel' : '');

      grid += '<div class="' + cls + '" data-d="' + dStr + '">' + d + '</div>';
    }
    grid += '</div>';

    return '<div class="bk-card">' + head +
      '<div class="bk-cal-wrap">' +
      '<div class="bk-cal-nav">' +
      '<button type="button" id="bk-prev" ' + (canPrev ? '' : 'disabled') + '>&#8249;</button>' +
      '<span class="bk-cal-title">' + MONTHS[vm.getMonth()] + ' ' + vm.getFullYear() + '</span>' +
      '<button type="button" id="bk-next" ' + (canNext ? '' : 'disabled') + '>&#8250;</button>' +
      '</div>' + grid + '</div></div>';
  }

  // ── Slot card ─────────────────────────────────────────────────────
  function renderSlotCard() {
    var done = !!state.selSlot;
    var head = '<div class="bk-card-head">' +
      '<div class="bk-step-num' + (done ? ' done' : '') + '">' + (done ? '✓' : '2') + '</div>' +
      '<h4>Select Time Slot</h4></div>';

    var body;
    if (!state.selDate) {
      body = '<div class="bk-slots-ph">← Pick a date first</div>';
    } else if (state.checking) {
      body = '<div class="bk-slots-ph"><span class="bk-spin"></span>Checking availability…</div>';
    } else {
      body = '<div class="bk-slots">';
      ['morning', 'evening'].forEach(function(key) {
        var info = SLOTS[key];
        var avail = state.avail ? state.avail[key] : null;
        var bookedCount = state.avail && state.avail.counts ? state.avail.counts[key] : null;
        var alreadyBooked = state.avail && state.avail.mine ? !!state.avail.mine[key] : false;
        var tooSoon = state.selDate ? !isSlotBookable(state.selDate, key) : false;
        var isSel = state.selSlot === key;
        var isNa = avail === false || tooSoon;
        var stTxt, stCls;
        if (avail === null) {
          stTxt = 'Checking…';
          stCls = 'bk-st-chk';
        } else if (alreadyBooked) {
          stTxt = 'This product is already booked for this slot';
          stCls = 'bk-st-na';
        } else if (avail && !tooSoon) {
          stTxt = bookedCount !== null ? bookedCount + '/' + MAX_BOOKINGS_PER_SLOT + ' booked' : 'Available';
          stCls = 'bk-st-ok';
        } else if (bookedCount !== null && bookedCount >= MAX_BOOKINGS_PER_SLOT) {
          stTxt = 'Fully booked';
          stCls = 'bk-st-na';
        } else {
          stTxt = 'Unavailable';
          stCls = 'bk-st-na';
        }
        body +=
          '<div class="bk-slot' + (isSel ? ' bk-slot-sel' : '') + (isNa ? ' bk-slot-na' : '') +
          '" data-slot="' + key + '"' + (isNa ? ' tabindex="-1"' : '') + '>' +
          '<div class="bk-slot-ico">' + info.icon + '</div>' +
          '<span class="bk-slot-lbl">' + info.label + '</span>' +
          '<span class="bk-slot-time">' + info.time + '</span>' +
          '<span class="bk-slot-st ' + stCls + '">' + stTxt + '</span>' +
          '</div>';
      });
      body += '</div>';
    }
    return '<div class="bk-card">' + head + body +
      '<div class="bk-delivery-note">ملاحظة: الفترة المختارة هي فترة التوصيل وليست فترة الخدمة.</div>' +
      '</div>';
  }

  // Floating availability bubble — pops above the fixed WhatsApp icon once a
  // date is picked, and hides when a time slot is chosen or the ✕ is clicked
  function syncAvailBubble() {
    var show = state.selDate && !state.selSlot && !state.bubbleDismissed;
    var el = document.getElementById('bk-avail-float');
    if (!show) {
      if (el && el.parentNode) el.parentNode.removeChild(el);
      return;
    }
    if (el) return;
    el = document.createElement('div');
    el.id = 'bk-avail-float';
    el.className = 'bk-avail-float';
    el.setAttribute('role', 'status');
    el.innerHTML =
      '<button type="button" class="bk-avail-float-close" aria-label="إغلاق">✕</button>' +
      '<span>لم تجد الوقت المناسب؟ تواصل معنا عبر الواتساب، وقد نتمكن من توفيره لك.</span>';
    el.querySelector('.bk-avail-float-close').addEventListener('click', function() {
      state.bubbleDismissed = true;
      syncAvailBubble();
    });
    document.body.appendChild(el);
  }

  // ── Summary ───────────────────────────────────────────────────────
  function renderSummary() {
    return '<div id="bk-summary">' +
      '<div class="bk-sum-item"><div class="bk-sum-lbl">Date</div><div class="bk-sum-val" id="bk-sv-date">—</div></div>' +
      '<div class="bk-sum-item"><div class="bk-sum-lbl">Slot</div><div class="bk-sum-val" id="bk-sv-slot">—</div></div>' +
      '</div>';
  }

  // ─── Bind events ─────────────────────────────────────────────────
  function bindCal() {
    var prev = document.getElementById('bk-prev');
    var next = document.getElementById('bk-next');
    if (prev) prev.addEventListener('click', function() {
      state.viewMonth = new Date(state.viewMonth.getFullYear(), state.viewMonth.getMonth() - 1, 1);
      render();
    });
    if (next) next.addEventListener('click', function() {
      state.viewMonth = new Date(state.viewMonth.getFullYear(), state.viewMonth.getMonth() + 1, 1);
      render();
    });

    document.querySelectorAll('.bk-day:not(.bk-off):not(.bk-empty)').forEach(function(el) {
      el.addEventListener('click', async function() {
        var parts = el.dataset.d.split('-');
        var selectedDate = new Date(+parts[0], +parts[1] - 1, +parts[2]);

        if (!isDateBookable(selectedDate)) {
          showErr('This date is not available for booking. Please select a date at least 24 hours from now.');
          return;
        }

        state.selDate = selectedDate;
        state.selSlot = null;
        state.avail = null;
        state.showSlots = true; // reveal morning/evening automatically
        state.checking = true;
        state.bubbleDismissed = false;
        render();

        try {
          state.avail = withTimeRule(await checkAvail(el.dataset.d), selectedDate);
        } catch (e) {
          state.avail = null;
        }
        state.checking = false;
        render();
      });
    });
  }

  function bindSlots() {
    document.querySelectorAll('.bk-slot:not(.bk-slot-na)').forEach(function(el) {
      el.addEventListener('click', function() {
        state.selSlot = el.dataset.slot;
        clearErr();
        render();
      });
    });
  }

  // ─── Sync hidden inputs & summary ─────────────────────────────────
  function syncHiddenInputs() {
    var dv = document.getElementById('bk-date-val');
    var sv = document.getElementById('bk-slot-val');
    var di = document.getElementById('bk-date-iso');
    var sk = document.getElementById('bk-slot-key');

    if (dv) dv.value = state.selDate ?
      state.selDate.toLocaleDateString('en-GB', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      }) : '';
    if (sv) sv.value = state.selSlot ? SLOTS[state.selSlot].label + ' (' + SLOTS[state.selSlot].time + ')' : '';
    if (di) di.value = state.selDate ? fmt(state.selDate) : '';
    if (sk) sk.value = state.selSlot || '';
  }

  function syncSummary() {
    var el = document.getElementById('bk-summary');
    if (!el) return;
    if (state.selDate || state.selSlot) {
      el.classList.add('show');
      var sd = document.getElementById('bk-sv-date');
      var ss = document.getElementById('bk-sv-slot');
      if (sd) sd.textContent = state.selDate ?
        state.selDate.toLocaleDateString('en-GB', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        }) : '—';
      if (ss) ss.textContent = state.selSlot ? SLOTS[state.selSlot].label : '—';
    } else {
      el.classList.remove('show');
    }
  }

  // ─── Error helpers ────────────────────────────────────────────────
  function showErr(msg) {
    var el = document.getElementById('bk-err');
    if (el) {
      el.textContent = '⚠ ' + msg;
      el.classList.add('show');
      el.classList.remove('bk-flash');
      void el.offsetWidth; // restart the flash animation
      el.classList.add('bk-flash');
    }
  }

  function clearErr() {
    var el = document.getElementById('bk-err');
    if (el) {
      el.classList.remove('show');
      el.classList.remove('bk-flash');
    }
  }

  // ─── Button state control ────────────────────────────────────────
  function getForm() {
    var root = document.getElementById('bk-widget');
    return root && root.closest ? root.closest('form') : null;
  }

  function syncAddToCartState() {
    var form = getForm();
    var btn = form && form.querySelector('[type="submit"]');
    if (!btn) return;
    var valid = !!(state.selDate && state.selSlot) && !state.submitting;
    btn.disabled = !valid;
    btn.classList.toggle('is-disabled', !valid);
  }

  // ─── Add to cart ─────────────────────────────────────────────────
  // The theme adds to cart from its own submit listener on `document`.
  // This listener runs earlier (window, capture phase), stops the theme's
  // handler, checks availability FIRST, and only then adds the item.
  window.addEventListener('submit', function(e) {
    var form = getForm();
    if (!form || e.target !== form) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    addToCart(form);
  }, true);

  async function addToCart(form) {
    if (state.submitting) return;

    if (!state.selDate) {
      showErr('Please select a delivery date.');
      return;
    }
    if (!state.selSlot) {
      showErr('Please select a time slot.');
      return;
    }
    if (!isDateBookable(state.selDate) || !isSlotBookable(state.selDate, state.selSlot)) {
      showErr('This date is no longer available for booking. Please choose another date.');
      return;
    }

    clearErr();
    syncHiddenInputs();
    var dateStr = fmt(state.selDate);
    var slotKey = state.selSlot;

    state.submitting = true;
    state.checking = true;
    render();

    try {
      var avail;
      try {
        avail = withTimeRule(await checkAvail(dateStr), state.selDate);
      } catch (_) {
        avail = null;
      }
      state.avail = avail;
      state.checking = false;

      if (!avail) {
        render();
        showErr('Could not check availability. Please try again.');
        return;
      }
      if (avail[slotKey] === false) {
        state.selSlot = null;
        render();
        if (avail.mine && avail.mine[slotKey]) {
          showErr('This product is already booked for this slot. Please choose another time.');
        } else if (avail.counts && avail.counts[slotKey] >= MAX_BOOKINGS_PER_SLOT) {
          showErr('That slot has reached the daily capacity of 2 bookings. Please choose another time.');
        } else {
          showErr('That slot is already booked for this product on the selected date. Please choose another time.');
        }
        return;
      }

      if (await checkCartForConflict(dateStr, slotKey) === true) {
        render();
        showErr('This product is already in your cart for this date and slot. Please choose another time.');
        return;
      }

      render(); // keeps hidden inputs in sync before reading the form
      var formData = new FormData(form);
      // A product can hold a slot only once, so one unit per booking.
      formData.set('quantity', '1');

      var resp = await fetch('/cart/add.js', {
        method: 'POST',
        headers: { Accept: 'application/json' },
        body: formData
      });
      var json = await resp.json().catch(function() { return {}; });
      if (!resp.ok || json.status) {
        showErr(json.description || json.message || 'Could not add to cart. Please try again.');
        return;
      }

      window.location.href = '/cart';
    } finally {
      state.submitting = false;
      state.checking = false;
      syncAddToCartState();
    }
  }

  // ─── Init ────────────────────────────────────────────────────────
  async function init() {
    var minDate = getMinBookableDate();
    state.viewMonth = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
    render();
    try {
      await resolveProductScope();
    } catch (_) { /* fall back to Shopify id */ }
    await Promise.all([loadFullBlockedDates(), loadFullBookedDates()]).catch(function() {});
    render();
    startLiveRefresh();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
